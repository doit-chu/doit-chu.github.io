{{- /* 홈 디자인 — 배경·히어로·카드 */ -}}
<style>
  /* ============ 글로벌 배경 톤 ============ */
  :root { --accent: #8b8db8; }
  /* PaperMod의 .list가 --code-bg(회색)를 쓰는 걸 덮어쓰기 */
  html, body, body.list, .list { background: #ffffff !important; }
  :root[data-theme="dark"] html,
  :root[data-theme="dark"] body,
  :root[data-theme="dark"] body.list,
  :root[data-theme="dark"] .list { background: #15151b !important; }
  :root { --theme: #ffffff; --entry: #ffffff; }
  :root[data-theme="dark"] { --theme: #15151b; --entry: #1e1e26; }

  /* ============ Hero ============ */
  .hero {
    position: relative;
    margin: 1.5rem 0 2.5rem;
    padding: 2.4rem 0 1.6rem;
    background: transparent;
    border: none;
  }
  .dark .hero { background: transparent; }
  .hero-blob { display: none; }
  .hero-inner { position: relative; z-index: 1; }
  .hero-chip {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.76rem;
    font-weight: 600;
    color: #8a7a5c;
    background: rgba(138, 122, 92, 0.10);
    margin-bottom: 0.9rem;
    letter-spacing: 0.02em;
  }
  .dark .hero-chip { background: rgba(200, 180, 140, 0.10); color: #c8b48c; }
  .hero-title {
    font-size: 2.2rem;
    font-weight: 700;
    margin: 0 0 0.5rem;
    color: #2c2c34;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .dark .hero-title { color: #ececf0; }
  .hero-content {
    font-size: 1rem;
    color: var(--secondary);
    line-height: 1.6;
  }
  .hero-content p { margin: 0; }

  /* ============ 시리즈 카드 ============ */
  .series-cards { margin: 0 0 2.5rem; }
  .series-cards-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 0.9rem;
    color: var(--primary);
    letter-spacing: -0.01em;
  }
  .series-cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .series-card {
    position: relative;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 20px 22px;
    border-radius: 16px;
    background: var(--entry);
    border: 1px solid rgba(0,0,0,0.06);
    text-decoration: none;
    color: inherit;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    overflow: hidden;
    isolation: isolate;
  }
  .dark .series-card { border-color: rgba(255,255,255,0.07); }
  .series-card::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    background: var(--card-tint, transparent);
    opacity: 0.4;
  }
  .dark .series-card::before { opacity: 0.25; }
  .series-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--card-accent, var(--accent));
  }
  .series-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.10);
    border-color: var(--card-accent, var(--accent));
  }
  .dark .series-card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.30); }
  .series-card-icon {
    font-size: 1.9rem;
    line-height: 1;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .series-card-body { flex: 1; min-width: 0; }
  .series-card-title {
    font-weight: 700;
    font-size: 1.08rem;
    margin-bottom: 3px;
    color: var(--primary);
  }
  .series-card-desc {
    font-size: 0.86rem;
    color: var(--secondary);
    line-height: 1.45;
    margin-bottom: 8px;
  }
  .series-card-count {
    display: inline-block;
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--card-accent, var(--accent));
    background: rgba(255,255,255,0.6);
    padding: 2px 9px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .dark .series-card-count { background: rgba(255,255,255,0.06); }

  /* 카테고리별 색상 — 흰 배경과 일관성, 거의 흰색 + 미세 그레이 톤 */
  .series-card.tint-llm,
  .series-card.tint-ai {
    --card-tint: #fafafa;
    --card-accent: #c0c0c0;
  }
  .dark .series-card.tint-llm,
  .dark .series-card.tint-ai {
    --card-tint: #232329;
    --card-accent: #4a4a52;
  }

  /* ============ 최근 글 — 박스 제거, 클린 리스트 ============ */
  .recent-posts { margin-top: 1.5rem; }
  .recent-posts .post-entry {
    position: relative;
    background: transparent !important;
    border: none !important;
    border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    padding: 1.5rem 0 1.5rem 1rem;
    margin: 0;
    transition: padding-left 0.2s ease;
  }
  .dark .recent-posts .post-entry { border-bottom-color: rgba(255,255,255,0.08) !important; }
  .recent-posts .post-entry:last-child { border-bottom: none !important; }
  .recent-posts .post-entry::before {
    content: '';
    position: absolute;
    left: 0; top: 1.95rem;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #cbb89c;
    opacity: 0.6;
    transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }
  .recent-posts .post-entry:hover {
    padding-left: 1.3rem;
  }
  .recent-posts .post-entry:hover::before {
    opacity: 1;
    transform: scale(1.3);
    background: #8a7a5c;
  }
  .dark .recent-posts .post-entry::before { background: #8a7a5c; }
  .dark .recent-posts .post-entry:hover::before { background: #c8b48c; }
  .recent-posts .entry-header h2 {
    font-size: 1.25rem !important;
    margin: 0 0 0.4rem !important;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .recent-posts .entry-content {
    font-size: 0.92rem;
    color: var(--secondary);
    line-height: 1.55;
    margin: 0 0 0.5rem;
  }
  .recent-posts .entry-content p { margin: 0; }
  .recent-posts .entry-footer {
    font-size: 0.78rem;
    color: var(--tertiary);
    opacity: 0.8;
  }

  /* ============ 모바일 ============ */
  @media (max-width: 600px) {
    .hero { padding: 2.2rem 1.4rem; border-radius: 16px; }
    .hero-title { font-size: 1.9rem; }
    .series-cards-grid { grid-template-columns: 1fr; }
  }
</style>
