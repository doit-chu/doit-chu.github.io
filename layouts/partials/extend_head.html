{{- /* MathJax for LaTeX math (when page has `math: true` or by default) */ -}}
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>

{{- /* Scroll progress bar */ -}}
<style>
  #reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    width: 0%;
    background: currentColor;
    color: #1a1a1a;
    z-index: 9999;
    transition: width 0.05s linear;
  }
  .dark #reading-progress { color: rgba(255, 255, 255, 0.85); }
</style>
