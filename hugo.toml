baseURL = 'https://doit-chu.github.io/'
languageCode = 'ko-kr'
title = 'doit-chu의 기술 블로그'
theme = 'PaperMod'

[params]
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true

[markup.highlight]
  style = 'github'
  lineNos = true

[[menu.main]]
  identifier = 'posts'
  name = '글'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'tags'
  name = '태그'
  url = '/tags/'
  weight = 20

[[menu.main]]
  identifier = 'archives'
  name = '아카이브'
  url = '/archives/'
  weight = 30
